name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref so rapid pushes don't pile up runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Config / manifest validation ─────────────────────────────────────────
  # This repo has no build system: it's markdown + JSON manifests + shell
  # install scripts. The gate lints the shell and parses every JSON file.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every source file must carry the copyright line. In this job rather than
      # a workflow of its own: the ruleset requires exactly one status check,
      # `CI Passed`, and `validate` is in its `needs` — a check in any other
      # workflow reports on the PR and gates nothing. Toolchain-free (stdlib
      # python3 is preinstalled; the script shells out only to git).
      - name: Copyright headers on every source file
        run: python3 .github/scripts/copyright-headers.py

      # shellcheck is preinstalled on ubuntu-latest runners. Scope to error
      # severity: this gate catches real bugs (unset vars, bad quoting that
      # changes behavior) without failing on stylistic SC2086-class notes.
      - name: Shellcheck (severity=error)
        run: |
          set -euo pipefail
          shellcheck --version
          mapfile -d '' files < <(find . -name '*.sh' \
            -not -path './.git/*' -not -path '*/node_modules/*' -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no shell scripts found"; exit 0
          fi
          printf 'checking: %s\n' "${files[@]}"
          shellcheck --severity=error "${files[@]}"

      # Validate that every committed JSON manifest parses. node is preinstalled
      # on ubuntu-latest. node_modules/dist/.git are excluded.
      - name: Validate JSON
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"; then
              echo "  [ok] $f"
            else
              echo "  [FAIL] invalid JSON: $f"
              fail=1
            fi
          done < <(find . -name '*.json' \
            -not -path './.git/*' -not -path '*/node_modules/*' -not -path '*/dist/*' -print0)
          exit $fail

  # ── Python tests ─────────────────────────────────────────────────────────
  # tests/ existed and ran nowhere: the gate was shellcheck plus a JSON parse,
  # so "CI is green" said nothing about the hooks or the installer. The suites
  # that caught the last round of bugs were enforced only by whoever remembered
  # to run test-local.sh.
  #
  # No pip install step on purpose. Every file under tests/ fakes what it needs
  # -- `ix` is a strict in-process fake (plus a script on PATH on POSIX) -- so
  # this needs nothing but an interpreter and git, and a dependency that cannot
  # be installed can never be the reason the gate is red.
  #
  # Windows is a real leg rather than a nicety: `ix` resolves differently there,
  # `.cmd` shims route arguments through cmd.exe, and the tests that cover both
  # skip on Linux. A Linux-only gate would report green on exactly the platform
  # those guards exist for.
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Run tests
        shell: bash
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  # ── Against a released ix CLI ────────────────────────────────────────────
  # Everything above fakes `ix`, so a flag Ix renames or an output key it
  # changes breaks the hooks with every test still green. This job installs a
  # pinned Ix release, verified against its published checksum, and runs
  # tests/real_ix_contract.py: the installer and the hooks against the real
  # CLI, with no backend (IX_ENDPOINT is a closed port). It fails if any argv
  # the hooks or installer build is rejected by that release.
  #
  # Move the ix-version pin deliberately, when the plugin is meant to track a
  # newer CLI; that pin is a dependency, not this plugin's own version.
  real-ix:
    name: Real ix (v${{ matrix.ix-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ix-version: ['0.12.0']
    env:
      IX_VERSION: ${{ matrix.ix-version }}
      IX_EXPECTED_VERSION: ${{ matrix.ix-version }}
      # sha256 of ix-<version>-linux-amd64.tar.gz, pinned here so a release
      # asset replaced after the fact (tarball and .sha256 together) fails the
      # job. Bump it with the ix-version pin.
      IX_SHA256: 'b9606253c5e300dbf4b933c82c6e0dc1d40a028aa344b5dc90dfe6dc34d89817'
      IX_ENDPOINT: http://127.0.0.1:1
      IX_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # The release tarball's `ix` launcher runs on Node 22+.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # `ix text` shells out to ripgrep.
      - name: Install ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep

      - name: Install ix ${{ matrix.ix-version }}
        run: |
          set -euo pipefail
          asset="ix-${IX_VERSION}-linux-amd64.tar.gz"
          base="https://github.com/ix-infrastructure/Ix/releases/download/v${IX_VERSION}"
          dl="$RUNNER_TEMP/ix-dl"
          mkdir -p "$dl" "$RUNNER_TEMP/ix" "$RUNNER_TEMP/ix-home"
          curl -fsSL --retry 3 -o "$dl/$asset" "$base/$asset"
          curl -fsSL --retry 3 -o "$dl/$asset.sha256" "$base/$asset.sha256"
          (cd "$dl" && sha256sum -c "$asset.sha256")
          echo "$IX_SHA256  $dl/$asset" | sha256sum -c -
          tar -xzf "$dl/$asset" --strip-components=1 -C "$RUNNER_TEMP/ix"
          echo "$RUNNER_TEMP/ix" >> "$GITHUB_PATH"
          echo "IX_HOME=$RUNNER_TEMP/ix-home" >> "$GITHUB_ENV"

      - name: ix --version
        run: |
          command -v ix
          ix --version

      - name: Hooks and installer against the real CLI
        run: python tests/real_ix_contract.py -v

  # ── Aggregate gate ───────────────────────────────────────────────────────
  # One stable required-status-check context. Fails if a needed job failed OR was
  # skipped/cancelled, so the job graph can be reshaped without orphaning the
  # required check.
  ci-success:
    name: CI Passed
    if: always()
    needs: [validate, tests, real-ix]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          echo "validate=${{ needs.validate.result }}"
          echo "tests=${{ needs.tests.result }}"
          echo "real-ix=${{ needs.real-ix.result }}"
          [ "${{ needs.validate.result }}" = "success" ]
          [ "${{ needs.tests.result }}" = "success" ]
          [ "${{ needs.real-ix.result }}" = "success" ]
